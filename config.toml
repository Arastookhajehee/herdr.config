onboarding = false

[keys]
prefix = "ctrl+space"
zoom = ["prefix+z", "prefix+f"]
cycle_pane_previous = "prefix+o"
cycle_pane_next = "prefix+i"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "pwsh -NoProfile -NonInteractive -WindowStyle Hidden -File \"%APPDATA%\\herdr\\center-active-pane.ps1\""

[theme]
name = "dracula"
auto_switch = false

[theme.custom]
panel_bg = "reset"

[ui.toast]
delivery = "system"

[terminal]
default_shell = "pwsh"
